{% comment %}
Delete confirmation modal. Include with: action (POST URL), title, item (name shown in bold), warning (optional extra text).
{% endcomment %}
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="{{ action }}">
                {% csrf_token %}
                <div class="modal-header">
                    <h2 class="modal-title h5" id="deleteModalLabel">{{ title }}</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    This permanently deletes <strong>{{ item }}</strong>{% if warning %} {{ warning }}{% endif %}.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
